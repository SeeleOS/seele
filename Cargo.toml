[workspace]
resolver = "3"
members = ["kernel"]
exclude = ["toolchain/rust"]

[package]
name = "seeleos-runner"
version = "0.1.0"
edition = "2024"
default-run = "seeleos-runner"

[[bin]]
name = "seeleos-runner"
path = "runner/bin.rs"

[[bin]]
name = "seeleos-runner-test"
path = "runner/test.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = { version = "0.11", default-features = false, features = ["uefi"] }
libc = "0.2"
ovmf-prebuilt = "0.2"
serde_json = "1.0"
