[package]
name = "control-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ovmf-prebuilt = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
