[unstable]
bindeps = true

[alias]
xrun = "run -p xtask -- run"
xtest = "run -p xtask -- test"
"xintegration-test" = "run -p xtask -- integration-test"
xrootfs = "run -p xtask -- rootfs-build"
"xrootfs-override" = "run -p xtask -- rootfs-build --override"
"xsysroot-mount" = "run -p xtask -- sysroot-mount"
"xvm-ps" = "run -p xtask -- vm-ps"

[target.x86_64-seele]
rustflags = [
  "-C", "link-arg=-L/home/elysia/coding-project/elysia-os/relibc-seele/target/x86_64-seele/release",
  "-C", "link-arg=-lm",
  "-C", "link-arg=-e",
  "-C", "link-arg=_start",
]

[target.x86_64-unknown-none]
rustflags = [
  "-C", "relocation-model=pic",
  "-C", "link-arg=-pie",
]
